<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UPS Consolidated Grades</title><style>body{font:15px system-ui;background:#f8f5fb;color:#33243f;max-width:1150px;margin:25px auto;padding:15px}h1{color:#603486}.panel{background:white;border:1px solid #dfd2e9;border-radius:12px;padding:20px;margin:15px 0}input,select{padding:9px;margin:7px 12px 12px 0;max-width:350px}button{background:#633686;color:white;border:0;padding:10px 15px;border-radius:7px;cursor:pointer}table{border-collapse:collapse;width:100%}th,td{padding:9px;border-bottom:1px solid #eee;text-align:left}th{background:#f1e8f8}#report{display:none}.muted{color:#756982}.scroll{overflow-x:auto}</style></head><body><h1>UPS Consolidated Student Grades</h1><p class="muted">Read-only review. Academic grades appear only after approval and finalization. Behaviour requires complete entries and approval of every contributing subject record.</p><div id="login" class="panel"><label>School email <input id="email" type="email"></label><label>Password <input id="password" type="password"></label><button id="sign">Sign in</button><p id="loginStatus" role="status"></p></div><div id="report" class="panel"><label>Class <select id="class"></select></label><label>Term <select id="term"><option value="TERM_1">Term 1</option><option value="TERM_2">Term 2</option><option value="TERM_3">Term 3</option></select></label><button id="refresh">Refresh</button> <button id="logout">Sign out</button><p id="status" role="status"></p><div class="scroll"><table><thead><tr><th>Student</th><th>Subject</th><th>Approved grade</th><th>Status</th><th>Behaviour received</th></tr></thead><tbody id="rows"></tbody></table></div></div><p><a href="index.html">Return to UPS Marks</a></p><script type="module">import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';const db=createClient('https://gbrxtfrpthcgbfluriod.supabase.co','sb_publishable_vI2aQgqrBcWqwGcpkATnlA_fUZT4GaK',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}}),$=id=>document.getElementById(id);async function refresh(){$('rows').replaceChildren();const {data,error}=await db.rpc('ups_consolidated_grades_v1',{p_class_id:$('class').value,p_period_code:$('term').value});if(error){$('status').textContent=error.message;return}for(const r of data){const row=document.createElement('tr');const values=[r.student_name,r.subject_name,r.grade??'Pending',r.record_status,r.subject_name==='Behaviour'?r.behaviour_received+' / '+r.behaviour_expected:'—'];for(const value of values){const c=document.createElement('td');c.textContent=String(value);row.append(c)}$('rows').append(row)}$('status').textContent=data.length+' subject and Behaviour rows. Pending records are not final grades.'}$('sign').onclick=async()=>{const r=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error){$('loginStatus').textContent=r.error.message;return}const c=await db.rpc('ups_my_behaviour_classes_v1');if(c.error){$('loginStatus').textContent=c.error.message;await db.auth.signOut();return}for(const x of c.data){const o=document.createElement('option');o.value=x.class_id;o.textContent='Grade '+x.grade_level+' '+x.section_name;$('class').append(o)}$('password').value='';$('login').style.display='none';$('report').style.display='block';if(c.data.length)await refresh()};$('refresh').onclick=refresh;$('class').onchange=refresh;$('term').onchange=refresh;$('logout').onclick=async()=>{await db.auth.signOut();$('report').style.display='none';$('login').style.display='block'};(async()=>{const {data}=await db.auth.getSession();if(!data?.session){location.replace('index.html');return;}const c=await db.rpc('ups_my_behaviour_classes_v1');if(c.error){$('loginStatus').textContent=c.error.message;return;}$('class').replaceChildren();for(const x of c.data){const o=document.createElement('option');o.value=x.class_id;o.textContent='Grade '+x.grade_level+' '+x.section_name;$('class').append(o)}$('login').style.display='none';$('report').style.display='block';if(c.data.length)await refresh();})();</script></body></html>
