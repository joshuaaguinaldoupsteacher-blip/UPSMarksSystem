<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UPS Behaviour Grade Report</title><style>body{font:15px system-ui;background:#f7f3fb;color:#30233d;max-width:1150px;margin:30px auto;padding:16px}.card{background:white;border:1px solid #e2d4ec;border-radius:13px;padding:22px;margin:18px 0}h1{color:#643587}input,select{display:block;padding:10px;margin:8px 0 14px;width:100%;max-width:370px}button{background:#643587;color:white;border:0;padding:10px 16px;border-radius:7px}table{width:100%;border-collapse:collapse}th,td{padding:10px;text-align:left;border-bottom:1px solid #eee}th{background:#f4ecf8}#report{display:none}.muted{color:#756782}.scroll{overflow:auto}</style></head><body><h1>Behaviour Grade Completion Report</h1><p class="muted">Behaviour completion report. Student results are available when required subject entries are complete.</p><div class="card" id="login"><label>School email<input id="email" type="email"></label><label>Password<input id="password" type="password"></label><button id="sign">Sign in</button><p id="loginStatus"></p></div><div id="report"><div class="card"><label>Class<select id="class"></select></label><label>Term<select id="term"><option>TERM_1</option><option>TERM_2</option><option>TERM_3</option></select></label><button id="refresh">Refresh report</button> <button id="logout">Sign out</button><p id="status"></p><div class="scroll"><table><thead><tr><th>Student</th><th>Expected</th><th>Received</th><th>Missing</th><th>Provisional average</th><th>Official Behaviour grade</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div></div><a href="index.html">Back to main marks system</a></div><script type="module">import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';const db=createClient('https://gbrxtfrpthcgbfluriod.supabase.co','sb_publishable_vI2aQgqrBcWqwGcpkATnlA_fUZT4GaK',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}}),$=id=>document.getElementById(id);async function reload(){$('rows').replaceChildren();const r=await db.rpc('ups_behaviour_completion_v1',{p_class_id:$('class').value,p_period:$('term').value});if(r.error){$('status').textContent=r.error.message;return}for(const x of r.data){const tr=document.createElement('tr');for(const v of [x.student_name,x.expected_count,x.received_count,x.missing_count,x.average_score??'—',x.final_score??'Pending',x.status]){const td=document.createElement('td');td.textContent=String(v);tr.append(td)}$('rows').append(tr)}$('status').textContent=r.data.length+' students shown. Incomplete entries are not final grades.'}$('sign').onclick=async()=>{const r=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error){$('loginStatus').textContent=r.error.message;return}const c=await db.rpc('ups_my_behaviour_classes_v1');if(c.error){$('loginStatus').textContent=c.error.message;await db.auth.signOut();return}for(const row of c.data){const o=document.createElement('option');o.value=row.class_id;o.textContent='Grade '+row.grade_level+' '+row.section_name;$('class').append(o)}$('password').value='';$('login').style.display='none';$('report').style.display='block';await reload()};$('refresh').onclick=reload;$('term').onchange=reload;$('class').onchange=reload;$('logout').onclick=async()=>{await db.auth.signOut();$('report').style.display='none';$('login').style.display='block'};(async()=>{const {data}=await db.auth.getSession();if(!data?.session){$('loginStatus').textContent='Please sign in to use this management tool.';return;}const c=await db.rpc('ups_my_behaviour_classes_v1');if(c.error){$('loginStatus').textContent=c.error.message;return;}$('class').replaceChildren();for(const x of c.data){const o=document.createElement('option');o.value=x.class_id;o.textContent='Grade '+x.grade_level+' '+x.section_name;$('class').append(o)}$('login').style.display='none';$('report').style.display='block';if(c.data.length)await reload();})();</script></body></html>
